name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gnssdo:
    name: gnssdo core (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt -p gnssdo --check
      - run: cargo clippy -p gnssdo --all-features -- -D warnings
      - run: cargo test -p gnssdo
      - run: cargo test -p gnssdo --all-features

  firmware:
    name: firmware (thumbv6m-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: stable
          target: thumbv6m-none-eabi
      # `check` (not build) so CI needs neither flip-link nor a probe.
      - run: cargo check
        working-directory: firmware
      - run: cargo check --all-features
        working-directory: firmware

  msrv:
    name: MSRV (gnssdo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      # Derive the MSRV from the declared rust-version so CI verifies *that* value
      # (a single source of truth; no hardcoded version to drift out of sync).
      - id: msrv
        run: echo "version=$(grep -oP 'rust-version\s*=\s*"\K[^"]+' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo test -p gnssdo --all-features
