[package]
name = "pico-gnss"
version = "0.1.0"
edition = "2021"

# host テスト可能な純粋ロジック (assembler 等)。
[lib]
name = "pico_gnss"

# firmware 本体 (embassy-rp, no_std/no_main)。
[[bin]]
name = "pico-gnss"
path = "src/main.rs"

# on-target ベンチ (src/bin/bench_nmea_parse.rs)。通常の build/test では作られない。
# 実機で: cargo run --release --features bench --bin bench_nmea_parse
[[bin]]
name = "bench_nmea_parse"
path = "src/bin/bench_nmea_parse.rs"
required-features = ["bench"]

[features]
# NMEA の時刻/日付抽出を nmea crate に切り替える (default は自前パーサ)。
# 性能/サイズ (実機 RP2040 Cortex-M0+ @125MHz 実測, src/bin/bench_nmea_parse.rs):
#   自前  ≈ 37 µs/RMC・パース実体 ≈ 0.8KB・依存 0
#   nmea  ≈ 619 µs/RMC (≈ 17x 遅い)・firmware .text +約 52KB・nom/chrono 等 6 crate
# 1Hz 用途では速度差は無視できる (≈0.06% CPU)。
# 挙動差: nmea は checksum 検証あり・年は世紀ピボット (yy=94→1994)、自前は未検証・20xx 固定。
nmea = ["dep:nmea", "dep:chrono"]

# on-target ベンチ用 (bench_nmea_parse バイナリを有効化、nmea も引く)。dev 計測専用。
bench = ["nmea"]

# lib が使う HAL 非依存の依存だけをここに。host (`cargo test-host`) でも build される。
[dependencies]
heapless = "0.9.3"
# NMEA パースを nmea crate に切り替える feature 用 (任意・no_std)。
nmea = { version = "0.7", default-features = false, features = ["RMC"], optional = true }
# nmea feature 時に RMC の時刻/日付 (chrono 型) からフィールドを取り出すため。
chrono = { version = "0.4", default-features = false, optional = true }

# firmware (組込ターゲット) 専用の依存。host ビルドには含まれないので、
# `cargo test-host` (--target x86_64) では embassy / defmt を一切引かない。
[target.'cfg(target_os = "none")'.dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
# embassy-rp 0.10 は defmt 1.x を要求する。logger も同世代の defmt-rtt 1.x を使う
# (defmt-rtt 0.4 は defmt 0.3 世代で、混ぜると 0.3.100 シム経由でコンパイルは通るが
#  probe-rs が RTT フレームをデコードできず無言になる)。
defmt = "1.0"
defmt-rtt = "1.0"
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-rp = { version = "0.10.0", features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp2040",
] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-futures = "0.1.1"
static_cell = "2.1.1"
embedded-io-async = "0.7.0"
portable-atomic = { version = "1.13.1", features = ["critical-section"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
