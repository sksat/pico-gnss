[workspace]
resolver = "2"
members = [
    "gnssdo",
    "rp-pps",
    "pico-gnss",
    "tiny-ntp",
    "tiny-ptp",
    "pico-10base-t",
    "pico-ntp",
    "tools/swd-ntp-bridge",
]
# A bare `cargo build`/`cargo test` targets the host-safe cores: gnssdo, rp-pps's
# HAL-agnostic core, tiny-ntp, tiny-ptp, and pico-10base-t's frame/PHY codec. Build the
# embedded-only firmware explicitly: cd pico-gnss or cd pico-ntp (or -p ... --target ...).
# The rp-pps HAL backends need a target too.
default-members = ["gnssdo", "rp-pps", "tiny-ntp", "tiny-ptp", "pico-10base-t"]

[workspace.package]
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/sksat/pico-gnss"

# rp-pps depends on `gnssdo` by version (a normal crates.io dep in its published manifest); for
# local development this redirects that dep to the in-tree copy, so workspace changes to gnssdo are
# picked up without publishing. `cargo publish` ignores `[patch]`, so publish order is still
# gnssdo -> rp-pps -> pico-gnss (each downstream dep is version+path).
[patch.crates-io]
gnssdo = { path = "gnssdo" }
