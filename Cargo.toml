[workspace]
resolver = "2"
members = ["gnssdo", "rp-pps", "pico-gnss"]
# A bare `cargo build`/`cargo test` targets the host-safe cores (gnssdo + rp-pps's
# HAL-agnostic core). Build the embedded-only firmware explicitly: cd pico-gnss
# (or -p pico-gnss --target ...). The rp-pps HAL backends need a target too.
default-members = ["gnssdo", "rp-pps"]

[workspace.package]
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/sksat/pico-gnss-rs"
