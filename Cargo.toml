[workspace]
resolver = "2"
members = ["gnssdo", "firmware"]
# A bare `cargo build`/`cargo test` only targets the host-safe gnssdo.
# Build the embedded-only firmware explicitly: cd firmware (or -p pico-gnss --target ...).
default-members = ["gnssdo"]

[workspace.package]
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/sksat/pico-gnss-rs"
