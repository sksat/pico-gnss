[package]
name = "pico-gnss"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "pico-gnss"
path = "src/main.rs"

# On-target benchmark; not built by a normal build (requires the `bench` feature).
# On hardware: cd pico-gnss && cargo run --release --features bench --bin bench_nmea_parse
[[bin]]
name = "bench_nmea_parse"
path = "src/bin/bench_nmea_parse.rs"
required-features = ["bench"]

[features]
# Parse RMC via the nmea crate (delegates to rp-pps's external-nmea; see the rp-pps crate).
external-nmea = ["rp-pps/external-nmea"]
bench = ["dep:nmea"]

[dependencies]
gnssdo = { path = "../gnssdo" }
rp-pps = { path = "../rp-pps", features = ["embassy-rp", "gnssdo"] }
heapless = "0.9.3"
# The bench bin calls the nmea crate directly; the firmware itself uses rp-pps's built-in parser.
nmea = { version = "0.7", default-features = false, features = ["RMC"], optional = true }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
# embassy-rp 0.10 requires defmt 1.x; keep defmt-rtt on the same 1.x generation.
defmt = "1.0"
defmt-rtt = "1.0"
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-rp = { version = "0.10.0", features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp2040",
] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-futures = "0.1.1"
static_cell = "2.1.1"
embedded-io-async = "0.7.0"
portable-atomic = { version = "1.13.1", features = ["critical-section"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
