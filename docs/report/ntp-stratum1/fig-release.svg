<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" role="img" aria-label="1 秒ごとの送信と 307 ms ごとの放出がずれているため、次の放出までの待ちが毎秒 78.55 ms ずつ短くなる">
  <rect width="760" height="250" fill="#ffffff"/>
  <defs>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- 送信 -->
  <text x="52" y="58" font-size="12" fill="#2e7d5b" text-anchor="end">送信</text>
  <text x="52" y="74" font-size="10.5" fill="#888" text-anchor="end">1 秒</text>
  <line x1="60" y1="66" x2="710" y2="66" stroke="#ccc" stroke-width="1"/>
  <g stroke="#2e7d5b" stroke-width="2.4">
    <line x1="64" y1="52" x2="64" y2="80"/>
    <line x1="277" y1="52" x2="277" y2="80"/>
    <line x1="490" y1="52" x2="490" y2="80"/>
  </g>

  <!-- 放出 -->
  <text x="52" y="182" font-size="12" fill="#c1442e" text-anchor="end">放出</text>
  <text x="52" y="198" font-size="10.5" fill="#888" text-anchor="end">307 ms</text>
  <line x1="60" y1="190" x2="710" y2="190" stroke="#ccc" stroke-width="1"/>
  <g stroke="#c1442e" stroke-width="2.4">
    <line x1="60" y1="176" x2="60" y2="204"/>
    <line x1="126" y1="176" x2="126" y2="204"/>
    <line x1="191" y1="176" x2="191" y2="204"/>
    <line x1="257" y1="176" x2="257" y2="204"/>
    <line x1="322" y1="176" x2="322" y2="204"/>
    <line x1="388" y1="176" x2="388" y2="204"/>
    <line x1="453" y1="176" x2="453" y2="204"/>
    <line x1="519" y1="176" x2="519" y2="204"/>
    <line x1="584" y1="176" x2="584" y2="204"/>
    <line x1="650" y1="176" x2="650" y2="204"/>
  </g>

  <!-- 待ち -->
  <g stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#w)">
    <path d="M64,84 L64,150 L126,150 L126,172"/>
    <path d="M277,84 L277,150 L322,150 L322,172"/>
    <path d="M490,84 L490,150 L519,150 L519,172"/>
  </g>
  <text x="95" y="144" font-size="11.5" fill="#333" text-anchor="middle">290 ms</text>
  <text x="300" y="144" font-size="11.5" fill="#333" text-anchor="middle">211 ms</text>
  <text x="505" y="144" font-size="11.5" fill="#333" text-anchor="middle">133 ms</text>

  <text x="380" y="230" font-size="12.5" fill="#333" text-anchor="middle">1000 ms は 307 ms の 3 個ぶんに 78.55 ms 足りない。その端数のぶんだけ、待ちは毎秒短くなる。</text>
</svg>
