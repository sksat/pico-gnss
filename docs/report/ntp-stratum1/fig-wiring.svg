<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" role="img" aria-label="Pico の GP16 と GP17 が 33 Ω を介して Cat5 の送信対へ繋がり、対の間に 1 kΩ が入る。受信対はどこにも繋がっていない">
  <rect width="760" height="300" fill="#ffffff"/>

  <!-- Pico -->
  <rect x="40" y="88" width="132" height="104" rx="5" fill="#f4f4f4" stroke="#333"/>
  <text x="106" y="128" font-size="13" fill="#333" text-anchor="middle">Pico</text>
  <text x="106" y="150" font-size="10.5" fill="#666" text-anchor="middle">PIO1 SM0</text>
  <text x="168" y="112" font-size="11" fill="#333" text-anchor="end">GP17</text>
  <text x="168" y="180" font-size="11" fill="#333" text-anchor="end">GP16</text>

  <!-- TX+ の線 -->
  <line x1="172" y1="118" x2="243" y2="118" stroke="#333" stroke-width="1.6"/>
  <rect x="243" y="108" width="52" height="20" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
  <text x="269" y="102" font-size="11" fill="#333" text-anchor="middle">33 Ω</text>
  <line x1="295" y1="118" x2="556" y2="118" stroke="#333" stroke-width="1.6"/>

  <!-- TX− の線 -->
  <line x1="172" y1="186" x2="243" y2="186" stroke="#333" stroke-width="1.6"/>
  <rect x="243" y="176" width="52" height="20" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
  <text x="269" y="212" font-size="11" fill="#333" text-anchor="middle">33 Ω</text>
  <line x1="295" y1="186" x2="556" y2="186" stroke="#333" stroke-width="1.6"/>

  <!-- 対間の 470 -->
  <line x1="380" y1="118" x2="380" y2="142" stroke="#333" stroke-width="1.6"/>
  <rect x="370" y="142" width="20" height="20" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
  <line x1="380" y1="162" x2="380" y2="186" stroke="#333" stroke-width="1.6"/>
  <text x="398" y="156" font-size="11" fill="#333">1 kΩ</text>
  <circle cx="380" cy="118" r="3" fill="#333"/>
  <circle cx="380" cy="186" r="3" fill="#333"/>

  <!-- RJ45 -->
  <rect x="556" y="60" width="150" height="180" rx="5" fill="#ffffff" stroke="#333"/>
  <text x="631" y="82" font-size="12.5" fill="#333" text-anchor="middle">Cat5</text>
  <text x="566" y="114" font-size="11" fill="#333">白緑</text>
  <text x="566" y="182" font-size="11" fill="#333">緑</text>
  <text x="631" y="140" font-size="11" fill="#333" text-anchor="middle">送信対 (1, 2 番)</text>

  <!-- 未接続の受信対 -->
  <text x="566" y="212" font-size="11" fill="#999">白橙</text>
  <text x="600" y="212" font-size="11" fill="#999">橙</text>
  
  <text x="631" y="232" font-size="10.5" fill="#999" text-anchor="middle">受信対 (3, 6 番) — 未接続</text>

  <text x="380" y="272" font-size="12.5" fill="#333" text-anchor="middle">作ってあるのは 10BASE-T の送信側だけである。受信対はケーブルの中にあるが、どこにも繋いでいない。</text>
</svg>
