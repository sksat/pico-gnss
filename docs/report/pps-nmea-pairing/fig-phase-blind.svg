<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" role="img" aria-label="オシロに映る波形は、正しいエポックと 1 秒ずれたエポックのどちらとも両立する">
  <rect width="760" height="340" fill="#ffffff"/>
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <!-- オシロの画面 -->
  <text x="380" y="24" font-size="12.5" fill="#333" text-anchor="middle">オシロの画面</text>
  <rect x="252" y="34" width="256" height="122" rx="4" fill="#fafafa" stroke="#bbb"/>

  <!-- 立ち上がりの位置を示す補助線 -->
  <line x1="380" y1="58" x2="380" y2="150" stroke="#333" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="386" y1="58" x2="386" y2="150" stroke="#2e7d5b" stroke-width="0.8" stroke-dasharray="3 3"/>

  <text x="262" y="54" font-size="11" fill="#333">GPS-R 1PPS</text>
  <path fill="none" stroke="#333" stroke-width="2.2" d="M262,86 L380,86 L380,64 L428,64 L428,86 L498,86"/>

  <text x="262" y="112" font-size="11" fill="#2e7d5b">規律 1PPS 出力</text>
  <path fill="none" stroke="#2e7d5b" stroke-width="2.2" d="M262,144 L386,144 L386,122 L434,122 L434,144 L498,144"/>

  <!-- 位相差 -->
  <g stroke="#888" stroke-width="1">
    <line x1="380" y1="100" x2="386" y2="100"/>
    <line x1="380" y1="96" x2="380" y2="104"/>
    <line x1="386" y1="96" x2="386" y2="104"/>
    <line x1="386" y1="100" x2="444" y2="100"/>
  </g>
  <text x="448" y="104" font-size="11" fill="#888">数十 ns</text>

  <!-- 分岐 -->
  <g stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#d)">
    <path d="M300,158 C280,182 250,186 222,204"/>
    <path d="M460,158 C480,182 510,186 538,204"/>
  </g>
  <text x="380" y="194" font-size="12" fill="#333" text-anchor="middle">この画面と両立する解釈が二つある</text>

  <!-- 二つの解釈 -->
  <rect x="60" y="210" width="284" height="62" rx="4" fill="#2e7d5b" fill-opacity="0.08" stroke="#2e7d5b"/>
  <text x="202" y="236" font-size="12.5" fill="#2e7d5b" text-anchor="middle">この出力エッジ = 12:00:01</text>
  <text x="202" y="258" font-size="11.5" fill="#555" text-anchor="middle">正しい対応</text>

  <rect x="416" y="210" width="284" height="62" rx="4" fill="#c1442e" fill-opacity="0.08" stroke="#c1442e"/>
  <text x="558" y="236" font-size="12.5" fill="#c1442e" text-anchor="middle">この出力エッジ = 12:00:00</text>
  <text x="558" y="258" font-size="11.5" fill="#555" text-anchor="middle">1 秒遅れた対応</text>

  <text x="380" y="304" font-size="12.5" fill="#333" text-anchor="middle">オシロが答えるのは「どれだけずれているか」だけである。</text>
  <text x="380" y="324" font-size="12.5" fill="#333" text-anchor="middle">「そのエッジが何秒か」は画面の外にあり、外部の時計と比べて初めて決まる。</text>
</svg>
