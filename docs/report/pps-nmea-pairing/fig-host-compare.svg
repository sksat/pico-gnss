<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" role="img" aria-label="firmware の時刻を probe 経由でホストに出し、NTP 同期済みのホストの壁時計と突き合わせる構成">
  <rect width="760" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <g fill="#fafafa" stroke="#888">
    <rect x="40" y="70" width="105" height="60" rx="4"/>
    <rect x="205" y="70" width="150" height="60" rx="4"/>
    <rect x="415" y="70" width="95" height="60" rx="4"/>
    <rect x="570" y="70" width="120" height="60" rx="4"/>
    <rect x="570" y="188" width="120" height="44" rx="4"/>
  </g>
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="92" y="96">GPS-R</text>
    <text x="92" y="114" font-size="10" fill="#777">MT3333</text>
    <text x="280" y="96">Raspberry Pi Pico</text>
    <text x="280" y="114" font-size="10" fill="#777">GPSDO firmware</text>
    <text x="462" y="105">debug probe</text>
    <text x="630" y="96">host PC</text>
    <text x="630" y="114" font-size="10" fill="#777">NTP 同期済み</text>
    <text x="630" y="215">NTP サーバ</text>
  </g>

  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="145" y1="88" x2="200" y2="88"/>
    <line x1="145" y1="114" x2="200" y2="114"/>
    <line x1="355" y1="100" x2="410" y2="100"/>
    <line x1="510" y1="100" x2="565" y2="100"/>
    <line x1="630" y1="188" x2="630" y2="135"/>
  </g>
  <g font-size="10" fill="#555" text-anchor="middle">
    <text x="172" y="82">1PPS</text>
    <text x="172" y="130">NMEA</text>
    <text x="382" y="92">RTT</text>
    <text x="537" y="92">USB</text>
  </g>
  <text x="640" y="166" font-size="10" fill="#555">時刻を合わせる</text>

  <text x="40" y="264" font-size="12.5" fill="#333">ホストは受け取った各行に自分の壁時計を打つ。firmware が出した UTC との差が、表の値である。</text>
  <text x="40" y="286" font-size="12.5" fill="#333">経路は USB までで、ネットワークは挟まない。打刻は RTT のポーリングぶん 0.15 秒ほど遅れる。</text>
</svg>
