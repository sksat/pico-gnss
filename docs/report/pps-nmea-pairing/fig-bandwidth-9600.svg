<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" font-family="'Hiragino Sans','Noto Sans CJK JP','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" role="img" aria-label="毎秒 816 文字の NMEA は 9600 bps では 1 秒の 85% を占める">
  <rect width="760" height="190" fill="#ffffff"/>

  <g stroke="#333" stroke-width="2">
    <line x1="140" y1="52" x2="140" y2="146"/>
    <line x1="700" y1="52" x2="700" y2="146"/>
  </g>
  <g font-size="12" fill="#333">
    <text x="144" y="44">PPS エッジ</text>
    <text x="696" y="44" text-anchor="end">次の PPS エッジ</text>
  </g>

  <g font-size="12.5" fill="#333" text-anchor="end">
    <text x="128" y="88">9600 bps</text>
    <text x="128" y="105" font-size="11" fill="#777">1 秒 ≒ 1000 文字</text>
  </g>
  <rect x="140" y="70" width="560" height="44" fill="#f4f4f4" stroke="#ccc"/>
  <rect x="140" y="70" width="476" height="44" fill="#c1442e"/>
  <text x="154" y="97" font-size="12.5" fill="#ffffff">NMEA 816 文字 = 850 ms (85%)</text>
  <text x="658" y="97" font-size="11.5" fill="#777" text-anchor="middle">空き</text>

  <text x="140" y="136" font-size="11.5" fill="#c1442e">送信だけで 1 秒の大半が埋まり、時刻センテンスは境界の際まで押し出される</text>
  <text x="140" y="172" font-size="12" fill="#333">1 文字 10 bit (8N1) なので、9600 bps では 1 文字におよそ 1 ms かかる。</text>
</svg>
