[package]
name = "gnssdo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "no_std, HAL-agnostic GNSS-PPS-disciplined clock & holdover core (GPSDO): crystal frequency (ppb) estimation, PPS edge tracking, and an output phase-lock servo. Integer-only, zero-dependency."
keywords = ["gnssdo", "gpsdo", "gnss", "pps", "no_std"]
categories = ["embedded", "no-std", "science"]
license.workspace = true
readme = "README.md"
repository.workspace = true

[lib]
name = "gnssdo"

# No dependencies: the discipline core is pure integer logic. NMEA decoding and PPS↔time pairing
# (which need heapless / the optional `nmea` crate) live in the sibling `rp-pps` crate.
